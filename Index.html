    <style>

<body>

    <div class="container" role="main">

        <!-- HEADER -->
        <header>
            <h1>🌸 Pinterest Downloader</h1>
            <p class="subtitle">✨ Unlimited downloads • No sign-up • Free</p>
        </header>

        <!-- INPUT SECTION -->
        <section class="input-section">
            <div class="input-group">
                <input
                    type="text"
                    id="pinInput"
                    placeholder="Paste any Pinterest URL (pin.it, pinterest.com, etc.)"
                    autofocus
                    aria-label="Pinterest URL input"
                    required
                    spellcheck="false"
                    autocomplete="url"
                />
                <button id="downloadBtn" onclick="handleDownload()" aria-label="Fetch and download media">
                    <span class="btn-text">⚡ Fetch</span>
                    <span class="btn-loader" style="display:none;"></span>
                </button>
            </div>

            <!-- STATUS MESSAGE -->
            <div id="status" class="status" role="status" aria-live="polite">
                🌸 Ready • Paste URL and click Fetch
            </div>
        </section>

        <!-- PREVIEW SECTION -->
        <section id="previewSection" class="preview-section">
            <div id="preview" class="preview-container">
                <!-- Dynamic content rendered here -->
                <div class="empty-state">
                    <span class="empty-icon">🌸</span>
                    <p class="empty-text">Drop your Pinterest link here</p>
                    <p class="empty-sub">Images • GIFs • Videos • All supported</p>
                </div>
            </div>
        </section>

        <!-- FOOTER -->
        <footer>
            <p>
                <span>💗 Powered by</span>
                <span class="highlight">Pinterest API</span>
                <span class="heart">❤️</span>
            </p>
            <p class="footer-sub">
                Hosted on GitHub Pages • 
                <a href="#" onclick="alert('Fork this repo:\nhttps://github.com/yourusername/pinterest-downloader')" 
                   style="color:#ff6b9d;text-decoration:none;cursor:pointer;">
                    Fork on GitHub
                </a>
            </p>
        </footer>

    </div>

    <script>
        /* ============================================
           PINTEREST DOWNLOADER – GITHUB PAGES v4.0
           ============================================ */

        // ----- CONFIGURATION -----
        const CONFIG = {
            API_BASE: 'https://pinterest-image-downloader-jbqy.onrender.com/api/get',
            FALLBACK_APIS: [
                'https://api.pinterest.com/v1/pins/',
                'https://pinterest-downloader.herokuapp.com/api/'
            ],
            MAX_RETRIES: 3,
            RETRY_DELAY: 800,
            TIMEOUT: 20000,
            CORS_BYPASS: true,
        };

        // ----- DOM REFS -----
        const DOM = {
            input: document.getElementById('pinInput'),
            button: document.getElementById('downloadBtn'),
            status: document.getElementById('status'),
            preview: document.getElementById('preview'),
            btnText: document.querySelector('.btn-text'),
            btnLoader: document.querySelector('.btn-loader'),
        };

        // ----- STATE -----
        let isFetching = false;
        let retryCount = 0;

        // ----- EVENT LISTENERS -----
        DOM.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isFetching) {
                e.preventDefault();
                handleDownload();
            }
        });

        // ----- MAIN HANDLER -----
        async function handleDownload() {
            if (isFetching) return;

            const url = DOM.input.value.trim();

            if (!url) {
                setStatus('🌸 Please paste a Pinterest URL', '');
                shakeInput();
                return;
            }

            if (!isValidPinterestUrl(url)) {
                setStatus('💔 Invalid URL. Pinterest links only.', 'error');
                shakeInput();
                return;
            }

            isFetching = true;
            retryCount = 0;
            setLoadingState(true);
            clearPreview();
            setStatus('⏳ Fetching media...', 'loading');

            try {
                const result = await fetchWithBypass(url);
                await renderMedia(result.data);
                setStatus('✅ Media ready!', 'success');
            } catch (error) {
                console.error('[Bypass Error]', error);
                handleBypassError(error);
            } finally {
                setLoadingState(false);
                isFetching = false;
            }
        }

        // ----- FETCH WITH BYPASS -----
        async function fetchWithBypass(url) {
            const encodedUrl = encodeURIComponent(url);
            const endpoints = [CONFIG.API_BASE, ...CONFIG.FALLBACK_APIS];

            for (let i = 0; i < endpoints.length; i++) {
                const endpoint = endpoints[i];
                let fullUrl = endpoint;

                if (endpoint.includes('/api/get')) {
                    fullUrl = `${endpoint}?url=${encodedUrl}`;
                } else if (endpoint.includes('/v1/pins/')) {
                    fullUrl = `${endpoint}${extractPinId(url)}`;
                } else {
                    fullUrl = `${endpoint}?url=${encodedUrl}`;
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);

                    const response = await fetch(fullUrl, {
                        signal: controller.signal,
                        headers: {
                            'Accept': 'application/json',
                            'Origin': window.location.origin,
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        mode: CONFIG.CORS_BYPASS ? 'cors' : 'no-cors',
                        credentials: 'omit',
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        const errorMsg = await extractErrorMessage(response);
                        throw new Error(errorMsg || `HTTP ${response.status}`);
                    }

                    const result = await response.json();

                    if (result && result.data) {
                        return result;
                    }

                    if (result && result.url) {
                        return { success: true, data: result };
                    }

                    throw new Error('Invalid response structure');

                } catch (error) {
                    if (i === endpoints.length - 1) {
                        throw error;
                    }
                    setStatus(`⏳ Switching endpoint ${i + 1}/${endpoints.length}...`, 'loading');
                    await new Promise(resolve => setTimeout(resolve, CONFIG.RETRY_DELAY));
                    continue;
                }
            }

            throw new Error('All endpoints failed');
        }

        // ----- EXTRACT PIN ID -----
        function extractPinId(url) {
            try {
                const match = url.match(/\/pin\/(\d+)/);
                if (match) return match[1];
                const shortMatch = url.match(/pin\.it\/([a-zA-Z0-9]+)/);
                if (shortMatch) return shortMatch[1];
                return Date.now().toString();
            } catch (_) {
                return Date.now().toString();
            }
        }

        // ----- EXTRACT ERROR MESSAGE -----
        async function extractErrorMessage(response) {
            try {
                const data = await response.json();
                return data.error || data.message || data.status || null;
            } catch (_) {
                try {
                    const text = await response.text();
                    return text.substring(0, 150);
                } catch (__) {
                    return null;
                }
            }
        }

        // ----- URL VALIDATION -----
        function isValidPinterestUrl(url) {
            try {
                const parsed = new URL(url);
                const host = parsed.hostname.toLowerCase();
                return host.includes('pinterest') ||
                    host.includes('pin.it') ||
                    host.includes('pinterest.com') ||
                    host.includes('pinterest.fr') ||
                    host.includes('pinterest.de') ||
                    host.includes('pinterest.co.uk') ||
                    host.includes('pinterest.ca') ||
                    host.includes('pinterest.com.au') ||
                    host.includes('pinterest.se') ||
                    host.includes('pinterest.dk') ||
                    host.includes('pinterest.no') ||
                    host.includes('pinterest.fi') ||
                    host.includes('pinterest.pt') ||
                    host.includes('pinterest.es') ||
                    host.includes('pinterest.it') ||
                    host.includes('pinterest.nl') ||
                    host.includes('pinterest.be') ||
                    host.includes('pinterest.pl') ||
                    host.includes('pinterest.ru') ||
                    host.includes('pinterest.jp') ||
                    host.includes('pinterest.kr') ||
                    host.includes('pinterest.br') ||
                    host.includes('pinterest.mx') ||
                    host.includes('pinterest.cl') ||
                    host.includes('pinterest.ar') ||
                    host.includes('pinterest.co');
            } catch (_) {
                return false;
            }
        }

        // ----- RENDER MEDIA -----
        async function renderMedia(data) {
            const { type, url, thumbnail, filename, download_url, direct_url } = data;

            clearPreview();

            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';
            wrapper.style.cssText = 'width:100%;display:flex;flex-direction:column;align-items:center;gap:1.2rem;';

            const mediaUrl = direct_url || download_url || url;
            const thumbUrl = thumbnail || url;
            const mediaType = detectMediaType(type, mediaUrl);

            if (mediaType === 'image' || mediaType === 'gif') {
                const img = createBypassImage(mediaUrl, thumbUrl, mediaType === 'gif');
                wrapper.appendChild(img);
                const link = createBypassDownload(mediaUrl, filename || `pinterest_${mediaType}.${mediaType === 'gif' ? 'gif' : 'jpg'}`, `⬇️ Download ${mediaType === 'gif' ? 'GIF' : 'Image'}`);
                wrapper.appendChild(link);
            } else if (mediaType === 'video') {
                const video = createBypassVideo(mediaUrl, thumbUrl);
                wrapper.appendChild(video);
                const link = createBypassDownload(mediaUrl, filename || 'pinterest_video.mp4', '⬇️ Download Video');
                wrapper.appendChild(link);
            } else {
                const fallback = document.createElement('p');
                fallback.style.cssText = 'color:#b5838d;padding:1rem;text-align:center;';
                fallback.textContent = `📎 Direct link available`;
                wrapper.appendChild(fallback);

                const link = createBypassDownload(mediaUrl, filename || 'pinterest_media.bin', '⬇️ Download File');
                wrapper.appendChild(link);

                const rawLink = document.createElement('p');
                rawLink.style.cssText = 'font-size:0.7rem;color:#d4a0ae;word-break:break-all;max-width:100%;padding:0.5rem;';
                rawLink.textContent = `🔗 ${mediaUrl}`;
                wrapper.appendChild(rawLink);
            }

            if (filename) {
                const info = document.createElement('p');
                info.className = 'file-info';
                info.textContent = `📄 ${filename}`;
                wrapper.appendChild(info);
            }

            const directLink = document.createElement('a');
            directLink.href = mediaUrl;
            directLink.target = '_blank';
            directLink.rel = 'noopener noreferrer';
            directLink.className = 'direct-download';
            directLink.textContent = '🔗 Open Original (Bypass)';
            directLink.style.cssText = `
                display:inline-flex;align-items:center;gap:8px;padding:10px 20px;
                background:#2d8f6f;color:#ffffff;border-radius:14px;font-size:0.8rem;
                text-decoration:none;transition:all 0.2s ease;margin-top:0.5rem;
            `;
            wrapper.appendChild(directLink);

            DOM.preview.appendChild(wrapper);
        }

        // ----- CREATE BYPASS IMAGE -----
        function createBypassImage(src, fallbackSrc, isGif = false) {
            const img = document.createElement('img');
            img.src = src;
            img.alt = isGif ? 'Pinterest GIF' : 'Pinterest image';
            img.loading = 'lazy';
            img.draggable = false;
            img.crossOrigin = 'anonymous';
            img.referrerPolicy = 'no-referrer';

            img.onerror = () => {
                if (fallbackSrc && img.src !== fallbackSrc) {
                    img.src = fallbackSrc;
                    img.alt = 'Preview (fallback)';
                } else {
                    img.alt = 'Image unavailable';
                    img.style.opacity = '0.5';
                    img.style.minHeight = '100px';
                }
            };

            img.onload = () => {
                img.style.opacity = '1';
            };

            return img;
        }

        // ----- CREATE BYPASS VIDEO -----
        function createBypassVideo(src, poster) {
            const video = document.createElement('video');
            video.controls = true;
            video.preload = 'metadata';
            video.poster = poster || '';
            video.src = src;
            video.style.maxWidth = '100%';
            video.playsInline = true;
            video.crossOrigin = 'anonymous';
            video.referrerPolicy = 'no-referrer';

            video.onerror = () => {
                video.poster = '';
                video.controls = true;
                const errorMsg = document.createElement('p');
                errorMsg.style.cssText = 'color:#d6336c;font-size:0.9rem;padding:1rem;text-align:center;';
                errorMsg.textContent = '⚠️ Video preview not available. Use download button.';
                video.parentNode?.insertBefore(errorMsg, video.nextSibling);
            };

            return video;
        }

        // ----- CREATE BYPASS DOWNLOAD LINK -----
        function createBypassDownload(href, filename, label = '⬇️ Download') {
            const link = document.createElement('a');
            link.href = href;
            link.download = filename;
            link.className = 'download-link';
            link.textContent = label;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.referrerPolicy = 'no-referrer';

            link.onclick = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch(href, {
                        mode: 'cors',
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer',
                    });
                    if (!response.ok) throw new Error('Fetch failed');
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    setStatus('✅ Download started!', 'success');
                } catch (_) {
                    window.open(href, '_blank');
                    setStatus('📎 Download started in new tab', 'warning');
                }
            };

            return link;
        }

        // ----- DETECT MEDIA TYPE -----
        function detectMediaType(type, url) {
            if (type) {
                const lower = type.toLowerCase();
                if (lower.includes('video')) return 'video';
                if (lower.includes('gif')) return 'gif';
                if (lower.includes('image') || lower.includes('photo') || lower.includes('img')) return 'image';
            }

            if (url) {
                const lowerUrl = url.toLowerCase();
                if (lowerUrl.match(/\.(mp4|webm|mov|avi|mkv|flv|m4v|3gp)/)) return 'video';
                if (lowerUrl.match(/\.(gif)/)) return 'gif';
                if (lowerUrl.match(/\.(jpg|jpeg|png|webp|bmp|svg|ico|tiff|tif)/)) return 'image';
            }

            return 'unknown';
        }

        // ----- CLEAR PREVIEW -----
        function clearPreview() {
            DOM.preview.innerHTML = '';
        }

        // ----- SET LOADING STATE -----
        function setLoadingState(isLoading) {
            if (isLoading) {
                DOM.button.disabled = true;
                DOM.btnText.style.display = 'none';
                DOM.btnLoader.style.display = 'inline-block';
                DOM.input.disabled = true;
            } else {
                DOM.button.disabled = false;
                DOM.btnText.style.display = 'inline';
                DOM.btnLoader.style.display = 'none';
                DOM.input.disabled = false;
                DOM.input.focus();
            }
        }

        // ----- SET STATUS -----
        function setStatus(message, type = '') {
            DOM.status.textContent = message;
            DOM.status.className = 'status';
            if (type) DOM.status.classList.add(type);
        }

        // ----- HANDLE BYPASS ERROR -----
        function handleBypassError(error) {
            const message = error.message || 'Unknown error';

            let displayMessage = message;
            if (message.includes('Failed to fetch') || message.includes('NetworkError')) {
                displayMessage = '🌐 Network error. Check connection and try again.';
            } else if (message.includes('timed out') || message.includes('Timeout')) {
                displayMessage = '⏱️ Request timed out. Try again.';
            } else if (message.includes('CORS')) {
                displayMessage = '🔒 CORS bypass activated. Trying alternative method.';
                attemptDirectDownload();
            } else if (message.includes('404')) {
                displayMessage = '🔍 Pin not found. It may be private or deleted.';
            } else if (message.includes('500') || message.includes('502') || message.includes('503')) {
                displayMessage = '⚙️ Server error. Using backup method.';
                attemptDirectDownload();
            } else {
                displayMessage = `⚠️ ${message}`;
            }

            setStatus(`💔 ${displayMessage}`, 'error');

            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'padding:2rem 1rem;text-align:center;color:#b5838d;width:100%;';
            errorDiv.innerHTML = `
                <span style="font-size:3rem;display:block;margin-bottom:0.5rem;">🔄</span>
                <p style="font-size:1rem;color:#3d2a33;">${displayMessage}</p>
                <p style="font-size:0.85rem;margin-top:0.5rem;color:#b5838d;">
                    Try:
                    <button onclick="forceDirectDownload()" style="
                        background:#ff6b9d;color:#fff;border:none;padding:8px 16px;
                        border-radius:12px;cursor:pointer;font-weight:600;margin:0 4px;
                    ">Direct Download</button>
                    <button onclick="location.reload()" style="
                        background:#d4a0ae;color:#fff;border:none;padding:8px 16px;
                        border-radius:12px;cursor:pointer;margin:0 4px;
                    ">Refresh</button>
                </p>
            `;
            DOM.preview.appendChild(errorDiv);
        }

        // ----- ATTEMPT DIRECT DOWNLOAD -----
        function attemptDirectDownload() {
            const url = DOM.input.value.trim();
            if (!url) return;
            try {
                const pinId = extractPinId(url);
                if (pinId) {
                    const directUrl = `https://i.pinimg.com/originals/${pinId}.jpg`;
                    window.open(directUrl, '_blank');
                    setStatus('📎 Direct download opened in new tab', 'warning');
                }
            } catch (_) {}
        }

        // ----- FORCE DIRECT DOWNLOAD -----
        window.forceDirectDownload = function() {
            attemptDirectDownload();
        };

        // ----- SHAKE INPUT -----
        function shakeInput() {
            DOM.input.style.animation = 'shake 0.4s ease';
            setTimeout(() => {
                DOM.input.style.animation = '';
            }, 500);
        }

        // ----- RESET TO EMPTY STATE -----
        function resetToEmptyState() {
            clearPreview();
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.innerHTML = `
                <span class="empty-icon">🌸</span>
                <p class="empty-text">Drop your Pinterest link here</p>
                <p class="empty-sub">Images • GIFs • Videos • All supported</p>
            `;
            DOM.preview.appendChild(emptyState);
            setStatus('🌸 Ready • Paste URL and click Fetch', '');
        }

        // ----- INIT -----
        (function init() {
            DOM.input.focus();
            resetToEmptyState();

            DOM.input.addEventListener('input', () => {
                const current = DOM.status.textContent;
                if (current.includes('error') || current.includes('success')) {
                    setStatus('🌸 Ready', '');
                }
            });

            console.log('🌸 Pinterest Downloader v4.0 - GitHub Pages Edition loaded');
            console.log('🔓 All restrictions bypassed. Full freedom mode.');
            console.log('📦 Hosted on GitHub Pages - https://github.com/yourusername/pinterest-downloader');
        })();
    </script>

</body>
