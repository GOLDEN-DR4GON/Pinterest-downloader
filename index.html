<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Pinterest Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #ffeef8, #ffd6e7, #ffb8d0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            text-align: center;
            color: #d63384;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a85a7a;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ffb6d9;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            background: #fff5f9;
            color: #4a2a3a;
        }

        .input-group input:focus {
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #c08aa8;
        }

        .input-group button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d63384, #b82a6e);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.4);
            background: linear-gradient(135deg, #c02e78, #a02460);
        }

        .input-group button:active {
            transform: translateY(0);
        }

        .example {
            text-align: center;
            color: #a85a7a;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .example a {
            color: #d63384;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }

        .example a:hover {
            color: #b82a6e;
        }

        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #fff5f9;
            border-radius: 18px;
            border: 1px solid #ffd6e7;
        }

        .result-box.show {
            display: block;
        }

        .info-text {
            color: #7a5a6a;
            font-size: 14px;
            margin: 8px 0;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #28a745, #1e8e3a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.25);
            width: 100%;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.35);
            background: linear-gradient(135deg, #1e8e3a, #167a30);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .error {
            color: #dc3545;
            padding: 16px;
            background: #f8d7da;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #155724;
            padding: 12px;
            background: #d4edda;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #b8daff;
            display: none;
        }

        .success.show {
            display: block;
        }

        .note {
            color: #a85a7a;
            font-size: 12px;
            margin-top: 12px;
            padding: 10px;
            background: #fff0f5;
            border-radius: 10px;
            border: 1px solid #ffd6e7;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ffd6e7;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d63384, #28a745);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .filename-display {
            background: #f8f0f5;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0;
            font-family: monospace;
            font-size: 13px;
            color: #4a2a3a;
            word-break: break-all;
            border: 1px solid #ffd6e7;
        }

        /* Media preview */
        #mediaContainer {
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            background: #1a1a2e;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mediaContainer img,
        #mediaContainer video {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                width: 100%;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌸 Pinterest Downloader</h1>
        <p class="subtitle">Paste any Pinterest URL to download</p>

        <div class="input-group">
            <input type="text" id="pinUrl" placeholder="https://pin.it/..." />
            <button id="downloadBtn">Download</button>
        </div>

        <div class="example">
            <span>✨ Try: </span>
            <a onclick="setExample('https://pin.it/1ADF1XkNF')">Image</a>
            <span> | </span>
            <a onclick="setExample('https://pin.it/4ACnPonsw')">Video</a>
        </div>

        <div id="resultBox" class="result-box">
            <div id="mediaContainer"></div>
            <div id="mediaInfo">
                <p class="info-text" id="titleDisplay">📌 Loading...</p>
                <p class="info-text" id="typeDisplay">Type: Unknown</p>
                <p class="info-text" id="sizeDisplay">Size: Unknown</p>
                <div class="filename-display" id="filenameDisplay">📄 filename.mp4</div>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <button id="downloadBtnFile" class="download-btn">⬇ Save to Gallery / Download</button>
            <div id="error" class="error"></div>
            <div class="success" id="successMessage">✅ File saved successfully!</div>
            <div class="note">💡 On mobile, the file will save to your gallery. On desktop, it will download to your downloads folder.</div>
        </div>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================

        const API_BASE = 'https://pinterest-image-downloader-jbqy.onrender.com';

        const pinUrlInput = document.getElementById('pinUrl');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const mediaContainer = document.getElementById('mediaContainer');
        const titleDisplay = document.getElementById('titleDisplay');
        const typeDisplay = document.getElementById('typeDisplay');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const downloadBtnFile = document.getElementById('downloadBtnFile');
        const error = document.getElementById('error');
        const successMessage = document.getElementById('successMessage');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let currentData = null;

        // Example URLs
        function setExample(url) {
            pinUrlInput.value = url;
            downloadBtn.click();
        }

        // ============================================
        // MAIN FUNCTION - GET PIN INFO
        // ============================================

        async function handleDownload() {
            const url = pinUrlInput.value.trim();
            if (!url) {
                showError('Please enter a Pinterest URL');
                return;
            }

            try {
                new URL(url);
            } catch {
                showError('Invalid URL. Please enter a valid Pinterest URL.');
                return;
            }

            error.classList.remove('show');
            successMessage.classList.remove('show');
            resultBox.classList.remove('show');
            mediaContainer.innerHTML = '';
            downloadBtnFile.disabled = false;
            downloadBtnFile.textContent = '⬇ Save to Gallery / Download';

            try {
                // ============================================
                // STEP 1: Get pin info
                // ============================================

                console.log('📡 Fetching pin info...');
                const infoResponse = await fetch(`${API_BASE}/api/pin/url?url=${encodeURIComponent(url)}`);
                const infoData = await infoResponse.json();

                console.log('📦 Pin info:', infoData);

                if (!infoData.success || !infoData.data || !infoData.data.downloadUrl) {
                    showError('No media found for this pin. It might be private or deleted.');
                    return;
                }

                currentData = infoData.data;

                // ============================================
                // STEP 2: Show preview
                // ============================================

                const isVideo = currentData.type === 'video' || 
                               currentData.downloadUrl.includes('.mp4') || 
                               currentData.downloadUrl.includes('.webm');
                const isImage = !isVideo || 
                               currentData.downloadUrl.includes('.jpg') || 
                               currentData.downloadUrl.includes('.png') || 
                               currentData.downloadUrl.includes('.gif');

                mediaContainer.innerHTML = '';
                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = currentData.downloadUrl;
                    video.controls = true;
                    video.style.maxWidth = '100%';
                    video.style.maxHeight = '500px';
                    video.style.background = '#000';
                    video.autoplay = true;
                    video.muted = true;
                    mediaContainer.appendChild(video);
                } else if (isImage) {
                    const img = document.createElement('img');
                    img.src = currentData.downloadUrl;
                    img.alt = currentData.title || 'Downloaded image';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '500px';
                    mediaContainer.appendChild(img);
                } else {
                    mediaContainer.innerHTML = `
                        <div style="padding: 40px; color: #fff; text-align: center; background: #2a2a3e; width: 100%;">
                            <span style="font-size: 48px;">📄</span>
                            <p style="margin-top: 12px;">File ready for download</p>
                        </div>
                    `;
                }

                // Display info
                const filename = currentData.downloadUrl.split('/').pop() || 'file';
                const sizeText = currentData.size ? `${(currentData.size / 1024).toFixed(0)} KB` : 'Unknown';

                titleDisplay.textContent = `📌 ${currentData.title || 'Untitled'}`;
                typeDisplay.textContent = `Type: ${isVideo ? 'Video' : 'Image'}`;
                sizeDisplay.textContent = `Size: ${sizeText}`;
                filenameDisplay.textContent = `📄 ${filename}`;

                resultBox.classList.add('show');

                // ============================================
                // STEP 3: Set up download button
                // ============================================

                downloadBtnFile.onclick = function() {
                    downloadFile(currentData.downloadUrl, filename);
                };

            } catch (err) {
                console.error('❌ Error:', err);
                showError('Network error. Please check your connection and try again.');
            }
        }

        // ============================================
        // DOWNLOAD FILE - SAVES TO GALLERY
        // ============================================

        async function downloadFile(url, filename) {
            console.log('⬇️ Downloading:', url);

            // Disable button and show progress
            downloadBtnFile.disabled = true;
            downloadBtnFile.textContent = '⏳ Downloading...';
            progressBar.classList.add('show');
            progressFill.style.width = '0%';
            error.classList.remove('show');
            successMessage.classList.remove('show');

            try {
                // ============================================
                // STEP 1: Fetch the file
                // ============================================

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Get content length for progress
                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength) : 0;
                let loaded = 0;

                // Read the response as a stream
                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    loaded += value.length;

                    // Update progress
                    if (total > 0) {
                        const percent = Math.round((loaded / total) * 100);
                        progressFill.style.width = `${percent}%`;
                        downloadBtnFile.textContent = `⏳ ${percent}%`;
                    }
                }

                // Combine chunks into a single blob
                const blob = new Blob(chunks);
                const blobUrl = URL.createObjectURL(blob);

                // ============================================
                // STEP 2: Save the file
                // ============================================

                // For mobile: try to save to gallery using download attribute
                // For desktop: standard download
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Clean up
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

                // ============================================
                // STEP 3: Show success
                // ============================================

                successMessage.textContent = `✅ Saved: ${filename}`;
                successMessage.classList.add('show');
                progressFill.style.width = '100%';
                downloadBtnFile.textContent = '✅ Saved!';

                console.log('✅ Download complete:', filename);

            } catch (err) {
                console.error('❌ Download error:', err);
                error.textContent = `❌ Download failed: ${err.message}`;
                error.classList.add('show');
                downloadBtnFile.textContent = '⬇ Try Again';
            } finally {
                setTimeout(() => {
                    downloadBtnFile.disabled = false;
                    if (!downloadBtnFile.textContent.includes('Saved')) {
                        downloadBtnFile.textContent = '⬇ Save to Gallery / Download';
                    }
                    setTimeout(() => {
                        progressBar.classList.remove('show');
                        progressFill.style.width = '0%';
                    }, 3000);
                }, 2000);
            }
        }

        // ============================================
        // ERROR HANDLING
        // ============================================

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('show');
            resultBox.classList.remove('show');
            downloadBtnFile.disabled = false;
            downloadBtnFile.textContent = '⬇ Save to Gallery / Download';
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        downloadBtn.addEventListener('click', handleDownload);

        pinUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleDownload();
            }
        });

        // Auto-load if URL is provided in query string
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            if (url) {
                pinUrlInput.value = url;
                handleDownload();
            }
        });

        console.log('🌸 Pinterest Downloader loaded!');
        console.log(`📡 API Base: ${API_BASE}`);
        console.log('✅ Saves directly to gallery / downloads folder');
    </script>

</body>
</html>
