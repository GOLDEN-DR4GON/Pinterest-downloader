<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Pinterest Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #ffeef8, #ffd6e7, #ffb8d0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            text-align: center;
            color: #d63384;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a85a7a;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ffb6d9;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            background: #fff5f9;
            color: #4a2a3a;
        }

        .input-group input:focus {
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #c08aa8;
        }

        .input-group button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d63384, #b82a6e);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.4);
            background: linear-gradient(135deg, #c02e78, #a02460);
        }

        .input-group button:active {
            transform: translateY(0);
        }

        .example {
            text-align: center;
            color: #a85a7a;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .example a {
            color: #d63384;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }

        .example a:hover {
            color: #b82a6e;
        }

        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #fff5f9;
            border-radius: 18px;
            border: 1px solid #ffd6e7;
        }

        .result-box.show {
            display: block;
        }

        .api-url-display {
            background: #f8f0f5;
            padding: 12px;
            border-radius: 10px;
            margin: 12px 0;
            border: 1px solid #ffd6e7;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: #4a2a3a;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #28a745, #1e8e3a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.25);
            width: 100%;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.35);
            background: linear-gradient(135deg, #1e8e3a, #167a30);
        }

        .error {
            color: #dc3545;
            padding: 16px;
            background: #f8d7da;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .note {
            color: #a85a7a;
            font-size: 12px;
            margin-top: 12px;
            padding: 10px;
            background: #fff0f5;
            border-radius: 10px;
            border: 1px solid #ffd6e7;
            text-align: center;
        }

        /* Hidden form for submission */
        #downloadForm {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                width: 100%;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌸 Pinterest Downloader</h1>
        <p class="subtitle">Paste any Pinterest URL to download</p>

        <div class="input-group">
            <input type="text" id="pinUrl" placeholder="https://pin.it/..." />
            <button id="downloadBtn">Download</button>
        </div>

        <div class="example">
            <span>✨ Try: </span>
            <a onclick="setExample('https://pin.it/1ADF1XkNF')">Image</a>
            <span> | </span>
            <a onclick="setExample('https://pin.it/4ACnPonsw')">Video</a>
        </div>

        <div id="resultBox" class="result-box">
            <div class="api-url-display" id="apiUrlDisplay"></div>
            <button id="downloadBtnFile" class="download-btn">⬇ Download Now</button>
            <div id="error" class="error"></div>
            <div class="note">💡 URL is sent WITHOUT encoding via form submission</div>
        </div>

        <!-- Hidden form for GET submission -->
        <form id="downloadForm" method="GET" target="_blank">
            <input type="hidden" name="url" id="formUrlInput" value="">
        </form>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================

        const API_BASE = 'https://pinterest-image-downloader-jbqy.onrender.com';
        const API_GET_ENDPOINT = '/api/get';

        const pinUrlInput = document.getElementById('pinUrl');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultBox = document.getElementById('resultBox');
        const apiUrlDisplay = document.getElementById('apiUrlDisplay');
        const downloadBtnFile = document.getElementById('downloadBtnFile');
        const error = document.getElementById('error');
        const downloadForm = document.getElementById('downloadForm');
        const formUrlInput = document.getElementById('formUrlInput');

        let currentPinUrl = '';

        // Example URLs
        function setExample(url) {
            pinUrlInput.value = url;
            downloadBtn.click();
        }

        // ============================================
        // MAIN FUNCTION
        // ============================================

        function handleDownload() {
            const url = pinUrlInput.value.trim();
            if (!url) {
                showError('Please enter a Pinterest URL');
                return;
            }

            try {
                new URL(url);
            } catch {
                showError('Invalid URL. Please enter a valid Pinterest URL.');
                return;
            }

            currentPinUrl = url;
            error.classList.remove('show');

            // ============================================
            // BUILD API URL - Display Only
            // ============================================
            
            const apiUrl = `${API_BASE}${API_GET_ENDPOINT}?url=${url}`;
            
            console.log('📡 API URL (display):', apiUrl);
            
            // Show the URL
            apiUrlDisplay.textContent = `🔗 ${apiUrl}`;
            resultBox.classList.add('show');

            // ============================================
            // SET UP FORM SUBMISSION - NO ENCODING
            // ============================================
            
            downloadBtnFile.onclick = function() {
                // Set the form action to the API endpoint
                downloadForm.action = `${API_BASE}${API_GET_ENDPOINT}`;
                
                // Set the url parameter value (no encoding - form handles it)
                formUrlInput.value = url;
                
                // Submit the form - browser will NOT encode the URL
                downloadForm.submit();
                
                console.log('📤 Form submitted with URL:', url);
            };
        }

        // ============================================
        // ERROR HANDLING
        // ============================================

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('show');
            resultBox.classList.remove('show');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        downloadBtn.addEventListener('click', handleDownload);

        pinUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleDownload();
            }
        });

        // Auto-load if URL is provided in query string
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            if (url) {
                pinUrlInput.value = url;
                handleDownload();
            }
        });

        console.log('🌸 Pinterest Downloader loaded!');
        console.log(`📡 API Base: ${API_BASE}`);
        console.log('✅ Using form submission - no encoding!');
    </script>

</body>
</html>
