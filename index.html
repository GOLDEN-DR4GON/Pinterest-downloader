<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Pinterest Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #ffeef8, #ffd6e7, #ffb8d0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            text-align: center;
            color: #d63384;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a85a7a;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ffb6d9;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            background: #fff5f9;
            color: #4a2a3a;
        }

        .input-group input:focus {
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #c08aa8;
        }

        .input-group button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d63384, #b82a6e);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.4);
            background: linear-gradient(135deg, #c02e78, #a02460);
        }

        .input-group button:active {
            transform: translateY(0);
        }

        .example {
            text-align: center;
            color: #a85a7a;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .example a {
            color: #d63384;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }

        .example a:hover {
            color: #b82a6e;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #ffd6e7;
            border-top: 4px solid #d63384;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading p {
            color: #a85a7a;
        }

        #result {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: #fff5f9;
            border-radius: 18px;
            border: 1px solid #ffd6e7;
        }

        #mediaContainer {
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            background: #1a1a2e;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mediaContainer img,
        #mediaContainer video {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        #mediaInfo {
            padding: 8px 4px;
        }

        #mediaInfo h3 {
            color: #4a2a3a;
            margin-bottom: 8px;
            font-size: 18px;
            word-break: break-word;
        }

        #mediaInfo p {
            color: #7a5a6a;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #28a745, #1e8e3a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.25);
            width: 100%;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.35);
            background: linear-gradient(135deg, #1e8e3a, #167a30);
        }

        .error {
            color: #dc3545;
            padding: 16px;
            background: #f8d7da;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success-box {
            background: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            display: none;
            border: 1px solid #b8daff;
        }

        .success-box.show {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                width: 100%;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌸 Pinterest Downloader</h1>
        <p class="subtitle">Paste any Pinterest URL to download images & videos</p>

        <div class="input-group">
            <input type="text" id="pinUrl" placeholder="https://pin.it/..." />
            <button id="downloadBtn">Download</button>
        </div>

        <div class="example">
            <span>✨ Try: </span>
            <a onclick="setExample('https://pin.it/1ADF1XkNF')">Image</a>
            <span> | </span>
            <a onclick="setExample('https://pin.it/4uur7opvF')">Video</a>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>🌸 Processing your pin...</p>
        </div>

        <div id="result">
            <div id="mediaContainer"></div>
            <div id="mediaInfo">
                <h3 id="mediaTitle">Title</h3>
                <p id="mediaType">Type: </p>
                <p id="mediaSize">Size: </p>
                <!-- Filename is hidden -->
                <span id="filenameDisplay" class="hidden"></span>
                <!-- Download button now navigates to the API -->
                <a id="downloadLink" class="download-btn" target="_blank">⬇ Download File</a>
            </div>
        </div>

        <div id="error" class="error"></div>
        <div id="successBox" class="success-box">✅ File downloaded successfully!</div>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================

        const API_BASE = 'https://pinterest-image-downloader-jbqy.onrender.com';
        const API_GET_ENDPOINT = '/api/get?url=';

        const pinUrlInput = document.getElementById('pinUrl');
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const successBox = document.getElementById('successBox');
        const mediaContainer = document.getElementById('mediaContainer');
        const mediaTitle = document.getElementById('mediaTitle');
        const mediaType = document.getElementById('mediaType');
        const mediaSize = document.getElementById('mediaSize');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const downloadLink = document.getElementById('downloadLink');

        let currentPinUrl = '';

        // Example URLs
        function setExample(url) {
            pinUrlInput.value = url;
            downloadBtn.click();
        }

        // ============================================
        // MAIN FUNCTION
        // ============================================

        async function handleDownload() {
            const url = pinUrlInput.value.trim();
            if (!url) {
                showError('Please enter a Pinterest URL');
                return;
            }

            try {
                new URL(url);
            } catch {
                showError('Invalid URL. Please enter a valid Pinterest URL.');
                return;
            }

            currentPinUrl = url;

            // Show loading
            loading.style.display = 'block';
            result.style.display = 'none';
            error.classList.remove('show');
            successBox.classList.remove('show');

            try {
                // ============================================
                // STEP 1: Get pin info to show preview
                // ============================================

                console.log('📡 Fetching pin info...');
                const infoResponse = await fetch(`${API_BASE}/api/pin/url?url=${encodeURIComponent(url)}`);
                const infoData = await infoResponse.json();

                console.log('📦 Pin info:', infoData);

                if (!infoData.success || !infoData.data || !infoData.data.downloadUrl) {
                    showError('No media found for this pin. It might be private or deleted.');
                    return;
                }

                const pinData = infoData.data;

                // ============================================
                // STEP 2: Show the file preview
                // ============================================

                // Store filename in hidden element
                const filename = pinData.downloadUrl.split('/').pop() || 'file';
                filenameDisplay.textContent = filename;

                // Show preview
                await displayMedia(
                    pinData.downloadUrl,
                    pinData.size || null,
                    pinData.type || 'image',
                    pinData.title || 'Untitled'
                );

                // ============================================
                // STEP 3: Set up download link to navigate to API
                // ============================================

                // Build the direct API URL for auto-download
                const apiDownloadUrl = `${API_BASE}${API_GET_ENDPOINT}${encodeURIComponent(url)}`;
                downloadLink.href = apiDownloadUrl;
                downloadLink.target = '_blank'; // Opens in new tab
                downloadLink.textContent = '⬇ Download File';

                successBox.classList.add('show');

            } catch (err) {
                console.error('❌ Error:', err);
                showError('Network error. Please check your connection and try again.');
            } finally {
                loading.style.display = 'none';
            }
        }

        // ============================================
        // DISPLAY MEDIA (Filename NOT shown)
        // ============================================

        async function displayMedia(downloadUrl, size, type, title) {
            const isVideo = type === 'video' || downloadUrl.endsWith('.mp4') || downloadUrl.endsWith('.webm');
            const isImage = type === 'image' || downloadUrl.endsWith('.jpg') || downloadUrl.endsWith('.jpeg') || 
                           downloadUrl.endsWith('.png') || downloadUrl.endsWith('.gif') || 
                           downloadUrl.endsWith('.webp');
            const isM3U8 = downloadUrl.endsWith('.m3u8');

            // Show media preview
            mediaContainer.innerHTML = '';
            
            if (isVideo && !isM3U8) {
                const video = document.createElement('video');
                video.src = downloadUrl;
                video.controls = true;
                video.style.maxWidth = '100%';
                video.style.maxHeight = '500px';
                video.style.background = '#000';
                video.autoplay = true;
                video.muted = true;
                mediaContainer.appendChild(video);
            } else if (isImage) {
                const img = document.createElement('img');
                img.src = downloadUrl;
                img.alt = title || 'Downloaded image';
                img.style.maxWidth = '100%';
                img.style.maxHeight = '500px';
                mediaContainer.appendChild(img);
            } else {
                mediaContainer.innerHTML = `
                    <div style="padding: 40px; color: #fff; text-align: center; background: #2a2a3e;">
                        <span style="font-size: 64px;">${isM3U8 ? '📋' : '📄'}</span>
                        <p style="margin-top: 12px;">${isM3U8 ? 'M3U8 Playlist (Video Stream)' : 'File ready for download'}</p>
                    </div>
                `;
            }

            // Show info (filename is NOT shown)
            const sizeText = size ? `${(size / 1024).toFixed(0)} KB` : 'Unknown';
            let typeText = isM3U8 ? 'M3U8 Playlist' : isVideo ? 'Video' : isImage ? 'Image' : 'File';
            
            mediaTitle.textContent = title || 'Untitled';
            mediaType.textContent = `Type: ${typeText}`;
            mediaSize.textContent = `Size: ${sizeText}`;

            result.style.display = 'block';
            error.classList.remove('show');
        }

        // ============================================
        // ERROR HANDLING
        // ============================================

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('show');
            result.style.display = 'none';
            loading.style.display = 'none';
            successBox.classList.remove('show');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        downloadBtn.addEventListener('click', handleDownload);

        pinUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleDownload();
            }
        });

        // Auto-download if URL is provided in query string
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            if (url) {
                pinUrlInput.value = url;
                handleDownload();
            }
        });

        console.log('🌸 Pinterest Downloader loaded!');
        console.log(`📡 API Base: ${API_BASE}`);
        console.log(`📡 Download Endpoint: ${API_GET_ENDPOINT}`);
        console.log('Examples:');
        console.log('  Image: https://pin.it/1ADF1XkNF');
        console.log('  Video: https://pin.it/4uur7opvF');
    </script>

</body>
</html>
